<!DOCTYPE html>
<html>
<body>
  <h1>Auction: <span id="title">Loading...</span></h1>
  <h2>Current Price: $<span id="price">0</span></h2>
  
  <input type="number" id="bidAmount" placeholder="Enter amount">
  <button onclick="sendBid()">Place Bid</button>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("http://localhost:4000");
    const priceTag = document.getElementById('price');
    const titleTag = document.getElementById('title');

    // Handle initial data
    socket.on('auction:init', (data) => {
      titleTag.innerText = data.title;
      priceTag.innerText = data.currentPrice;
    });

    // Handle updates from other users
    socket.on('bid:update', (newPrice) => {
      priceTag.innerText = newPrice;
      console.log("Someone just bid!");
    });

    function sendBid() {
      const amount = document.getElementById('bidAmount').value;
      socket.emit('bid:submit', parseInt(amount));
    }
  </script>
</body>
</html>
